<!-- Modal para cadastro de usuário -->
<div class="modal" id="manageMembersModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-user-plus"></i> Cadastro de Usuário</h2>
            <button class="close-btn" id="closeMembersModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="userRegistrationForm" class="user-form">
                <div class="form-group">
                    <label for="username">Nome de usuário:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="first_name">Primeiro nome:</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                
                <div class="form-group">
                    <label for="last_name">Último nome:</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="role">Função:</label>
                    <select id="role" name="role" required>
                        <option value="">Selecione uma função</option>
                        <option value="superuser">SuperUser</option>
                        <option value="financeiro">Financeiro</option>
                        <option value="solicitante">Solicitante</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-register">
                        <i class="fas fa-user-plus"></i>
                        Cadastrar
                    </button>
                    <button type="button" class="btn-cancel" id="cancelUserRegistration">
                        <i class="fas fa-times"></i>
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal para adicionar/editar membro -->
<div class="modal" id="addMemberModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="addMemberTitle">Adicionar Membro</h2>
            <button class="close-btn" id="closeAddMemberModal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="addMemberForm">
                <div class="form-group">
                    <label for="memberName">Nome Completo</label>
                    <input type="text" id="memberName" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="memberEmail">E-mail</label>
                    <input type="email" id="memberEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="memberSector">Setor</label>
                    <select id="memberSector" name="sector" required>
                        <option value="administradores">Administradores</option>
                        <option value="financeiro">Financeiro</option>
                        <option value="solicitantes">Solicitantes</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="memberRole">Cargo</label>
                    <input type="text" id="memberRole" name="role" placeholder="Ex: Gerente Financeiro, Analista, etc.">
                </div>
                
                <div class="form-group">
                    <label for="memberPermissions">Permissões</label>
                    <div class="permissions-grid">
                        <label class="permission-item">
                            <input type="checkbox" name="permissions" value="view">
                            <span>Visualizar</span>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permissions" value="create">
                            <span>Criar</span>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permissions" value="edit">
                            <span>Editar</span>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permissions" value="delete">
                            <span>Excluir</span>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permissions" value="approve">
                            <span>Aprovar</span>
                        </label>
                        <label class="permission-item">
                            <input type="checkbox" name="permissions" value="admin">
                            <span>Administrar</span>
                        </label>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancelAddMember">Cancelar</button>
            <button type="submit" class="btn-primary" form="addMemberForm" id="saveMember">Salvar</button>
        </div>
    </div>
</div>
