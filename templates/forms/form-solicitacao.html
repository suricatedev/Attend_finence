<!-- Modal para criar nova solicitação financeira -->
<div class="modal" id="createCampaignModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Nova Solicitação Financeira</h2>
            <button class="close-btn" id="closeModal" aria-label="Fechar modal">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="createCampaignForm" method="POST" enctype="multipart/form-data" action="/Solicitacoes/home/">
                {% csrf_token %}
                <div class="form-group">
                    <label for="campaignId">ID da Solicitação</label>
                    <input type="text" id="campaignId" name="id" placeholder="Ex: INCXXXXX" value="">
                    <small class="form-help">Exemplo: INCXXXXX</small>
                </div>
                
                v
                
                <div class="form-group">
                    <label for="campaignTitle">Título da Solicitação</label>
                    <input type="text" id="campaignTitle" name="title" placeholder="Ex: Solicitação de pagamento para consultoria" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="campaignSolicitante">Nome do Solicitante</label>
                        <input type="text" id="campaignSolicitante" name="solicitante" placeholder="Ex: João Silva" required>
                    </div>

                    <div class="form-group">
                        <label for="campaignRecebedor">Nome do Recebedor</label>
                        <input type="text" id="campaignRecebedor" name="recebedor" placeholder="Ex: Maria Santos" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="campaignValor">Valor</label>
                    <input type="text" id="campaignValor" name="valor" placeholder="Digite o valor (ex: 1500)" required>
                    <small class="form-help">Digite apenas números, será formatado automaticamente</small>
                </div>

                <div class="form-group">
                    <label for="campaignService">Serviço</label>
                    <select id="campaignService" name="service" required>
                        <option value="">Selecione o tipo de serviço</option>
                        {% for servico in servicos_disponiveis %}
                        <option value="{{ servico.id }}">{{ servico.nome }}</option>
                        {% empty %}
                        <option value="" disabled>Nenhum serviço disponível</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="campaignDescription">Descrição</label>
                    <textarea id="campaignDescription" name="description" rows="3" placeholder="Descreva detalhadamente a solicitação financeira..." required></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="campaignDataPagamento">Data de Pagamento</label>
                        <input type="date" id="campaignDataPagamento" name="dataPagamento" required>
                    </div>
                    <div class="form-group">
                        <label for="campaignDataCriacao">Data de Criação</label>
                        <input type="date" id="campaignDataCriacao" name="dataCriacao" readonly style="background-color: #f0f0f0; cursor: not-allowed;">
                        <small class="form-help">Data preenchida automaticamente</small>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="campaignAnexos">Anexos</label>
                    <input type="file" id="campaignAnexos" name="anexos" accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png">
                    <small class="form-help">Formatos aceitos: PDF, DOC, DOCX, XLS, XLSX, JPG, PNG</small>
                </div>
                
                <div class="form-group">
                    <label for="campaignPriority">Prioridade</label>
                    <select id="campaignPriority" name="priority" required>
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="cancelCreate">
                Cancelar
            </button>
            <button type="submit" class="btn-primary" form="createCampaignForm">
                Criar Solicitação
            </button>
        </div>
    </div>
    <script src="/static/js/forms.js"></script>
    <script>
        // Preencher automaticamente a data de criação com a data de hoje
        document.addEventListener('DOMContentLoaded', function() {
            const dataCriacaoInput = document.getElementById('campaignDataCriacao');
            if (dataCriacaoInput) {
                const hoje = new Date();
                const ano = hoje.getFullYear();
                const mes = String(hoje.getMonth() + 1).padStart(2, '0');
                const dia = String(hoje.getDate()).padStart(2, '0');
                dataCriacaoInput.value = `${ano}-${mes}-${dia}`;
            }
        });
    </script>
</div>
