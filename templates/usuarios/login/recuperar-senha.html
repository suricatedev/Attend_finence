{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - Attend Finance</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <video id="bgVideo" class="bg-video" muted loop playsinline autoplay style="display: block;"></video>
    
    <div class="main-container">
        <div class="login-container">
            <div class="login-box">
                <form class="form" method="POST" action="{% url 'solicitar_recuperacao_senha' %}">
                    {% csrf_token %}
                    <div class="logo">
                        <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo-img">
                    </div>
                    <h1 class="header">Recuperar Senha</h1>
                    <p class="subtitle">Informe seu email cadastrado para receber um código de verificação</p>
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" style="margin-bottom: 1rem; padding: 0.75rem; border-radius: 8px; background: {% if message.tags == 'error' %}#f8d7da{% elif message.tags == 'success' %}#d4edda{% else %}#d1ecf1{% endif %}; color: {% if message.tags == 'error' %}#721c24{% elif message.tags == 'success' %}#155724{% else %}#0c5460{% endif %}; border: 1px solid {% if message.tags == 'error' %}#f5c6cb{% elif message.tags == 'success' %}#c3e6cb{% else %}#bee5eb{% endif %};">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <div class="input-group">
                        <label class="input-label">
                            <i class="fas fa-envelope"></i> Email
                        </label>
                        <input name="email" type="email" placeholder="seu@email.com" class="input" required autofocus />
                    </div>
                    
                    <button type="submit" class="button">
                        <i class="fas fa-paper-plane"></i>
                        Enviar Código
                    </button>
                    
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <a href="{% url 'login' %}" style="color: #FFCB57; text-decoration: none; font-size: 0.9rem;">
                            <i class="fas fa-arrow-left"></i> Voltar para o login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    // Script de background (reutilizado do login.html)
    (function() {
        const immediateImage = "{% static 'img/back04.png' %}";
        document.body.style.backgroundImage = `url('${immediateImage}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundColor = '#1a1a1a';
    })();
</script>
