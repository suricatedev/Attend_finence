{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend Finance - Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>


<!--   #################################### FORM 01 ##################################### FORM 01 ##################################################### -->



<body>
    <!-- O 'src' será definido dinamicamente pelo JavaScript abaixo -->
    <video id="bgVideo" class="bg-video" muted loop playsinline autoplay style="display: block;"></video>
    
    <div class="main-container">
        <div class="login-container">
            <div class="login-box">
                <form class="form" method="POST" action="{% url 'login'%}">
                    {% csrf_token %}
                    <div class="logo">
                        <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo-img">                    </div>
                    <h1 class="header">Bem-vindo de volta</h1>
                    <p class="subtitle">Por favor, insira seus dados.</p>
                    
                    <div class="input-group">
                        <label class="input-label">Usuário</label>
                        <input name="name" type="name" placeholder="Nome de Usuário" class="input" required />
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Senha</label>
                        <div class="password-input-wrapper">
                            <input type="password" name="password" id="passwordInput" placeholder="Senha" class="input" required />
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar/Ocultar senha">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="options">
                        <label class="remember-me">
                            <input type="checkbox" />
                            Lembrar senha
                        </label>
                        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                    </div>
                    
                    <button type="submit" class="button">
                        <i class="fas fa-sign-in-alt"></i>
                        Entrar
                    </button>
                    
                </form>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🎬 Inicializando background de login...');
        
        // 1. Lista de vídeos e imagens com caminhos gerados pelo Django
        const videoAssets = [
            "{% static 'img/back17.mp4' %}",
            "{% static 'img/back18.mp4' %}",
            "{% static 'img/back20.mp4' %}"
        ];
        
        // Imagens de fallback caso os vídeos não carreguem
        const imageAssets = [
            "{% static 'img/back04.png' %}",
            "{% static 'img/back05.png' %}",
            "{% static 'img/back06.png' %}"
        ];

        const allAssets = [...videoAssets, ...imageAssets];
        console.log('📦 Assets disponíveis:', allAssets);

        // 2. Lógica para escolher um asset diferente a cada visita
        var lastIndex = parseInt(localStorage.getItem('loginBgIndex'), 10);
        if (isNaN(lastIndex) || lastIndex < 0 || lastIndex >= allAssets.length) {
            lastIndex = -1; // Força a escolha de um novo na primeira vez
        }
        
        var nextIndex = allAssets.length > 1 ? (lastIndex + 1) % allAssets.length : 0;
        var chosenAsset = allAssets[nextIndex];
        console.log('✅ Asset escolhido:', chosenAsset);

        // 3. Aplicar o vídeo ou imagem de fundo
        var videoEl = document.getElementById('bgVideo');
        var isVideo = /\.(mp4|webm|ogg)$/i.test(chosenAsset);

        if (isVideo && videoEl) {
            console.log('🎥 Tentando carregar vídeo:', chosenAsset);
            
            // Verificar se o vídeo existe antes de tentar carregar
            var testVideo = new Audio(chosenAsset);
            testVideo.oncanplaythrough = function() {
                console.log('✅ Vídeo pode ser reproduzido');
                videoEl.src = chosenAsset;
                videoEl.style.display = 'block';
                videoEl.load();
                videoEl.play().catch(function(error) {
                    console.warn("⚠️ Reprodução automática bloqueada, tentando fallback:", error);
                    loadFallback();
                });
            };
            
            testVideo.onerror = function() {
                console.error('❌ Erro ao carregar vídeo:', chosenAsset);
                console.log('🔄 Tentando fallback para imagem...');
                loadFallback();
            };
            
            // Timeout de 3 segundos para detectar se o vídeo não carrega
            setTimeout(function() {
                if (!videoEl.src || videoEl.readyState === 0) {
                    console.warn('⏱️ Timeout ao carregar vídeo, usando fallback');
                    loadFallback();
                }
            }, 3000);
            
            // Tentar carregar diretamente também
            videoEl.src = chosenAsset;
            videoEl.style.display = 'block';
            videoEl.load();
            
            videoEl.addEventListener('loadeddata', function() {
                console.log('✅ Vídeo carregado com sucesso');
                videoEl.play().catch(function(error) {
                    console.warn("⚠️ Erro ao reproduzir:", error);
                });
            });
            
            videoEl.addEventListener('error', function(e) {
                console.error('❌ Erro no elemento de vídeo:', e);
                loadFallback();
            });
            
        } else {
            console.log('🖼️ Carregando imagem de fundo:', chosenAsset);
            if (videoEl) videoEl.style.display = 'none';
            loadImage(chosenAsset);
        }

        // Função para carregar imagem de fallback
        function loadFallback() {
            console.log('🔄 Carregando fallback...');
            var fallbackIndex = (nextIndex + 1) % imageAssets.length;
            var fallbackAsset = imageAssets[fallbackIndex] || imageAssets[0];
            if (videoEl) videoEl.style.display = 'none';
            loadImage(fallbackAsset);
        }
        
        // Função para carregar imagem
        function loadImage(imageSrc) {
            var img = new Image();
            img.onload = function() {
                document.body.style.backgroundImage = `url('${imageSrc}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
                console.log('✅ Imagem de fundo carregada:', imageSrc);
            };
            img.onerror = function() {
                console.error('❌ Erro ao carregar imagem:', imageSrc);
                // Usar uma cor de fundo como último recurso
                document.body.style.backgroundColor = '#1a1a1a';
            };
            img.src = imageSrc;
        }

        // 4. Salvar o índice para a próxima visita
        try {
            localStorage.setItem('loginBgIndex', String(nextIndex));
        } catch (e) {
            console.error("⚠️ Não foi possível salvar no localStorage:", e);
        }
        
        // 5. Configurar botão de mostrar/ocultar senha
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (togglePasswordBtn && passwordInput && eyeIcon) {
            togglePasswordBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                
                if (isPassword) {
                    // Mostrar senha
                    passwordInput.type = 'text';
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                    togglePasswordBtn.setAttribute('aria-label', 'Ocultar senha');
                } else {
                    // Ocultar senha
                    passwordInput.type = 'password';
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                    togglePasswordBtn.setAttribute('aria-label', 'Mostrar senha');
                }
            });
        }
    });
</script>
