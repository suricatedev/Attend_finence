{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend Finance - Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>


<!--   #################################### FORM 01 ##################################### FORM 01 ##################################################### -->



<body>
    <!-- O 'src' será definido dinamicamente pelo JavaScript abaixo -->
    <video id="bgVideo" class="bg-video" muted loop playsinline autoplay style="display: block;"></video>
    
    <div class="main-container">
        <div class="login-container">
            <div class="login-box">
                <form class="form" method="POST" action="{% url 'login'%}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next|default:'' }}">
                    <div class="logo">
                        <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo-img">                    </div>
                    <h1 class="header">Bem-vindo de volta</h1>
                    <p class="subtitle">Por favor, insira seus dados.</p>
                    
                    {% if erro %}
                    <div class="alert alert-error" style="margin-bottom: 1rem; padding: 0.75rem; border-radius: 8px; background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;">
                        <i class="fas fa-exclamation-circle"></i> {{ erro }}
                    </div>
                    {% endif %}
                    
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}" style="margin-bottom: 1rem; padding: 0.75rem; border-radius: 8px; background: {% if message.tags == 'error' %}#f8d7da{% elif message.tags == 'success' %}#d4edda{% else %}#d1ecf1{% endif %}; color: {% if message.tags == 'error' %}#721c24{% elif message.tags == 'success' %}#155724{% else %}#0c5460{% endif %}; border: 1px solid {% if message.tags == 'error' %}#f5c6cb{% elif message.tags == 'success' %}#c3e6cb{% else %}#bee5eb{% endif %};">
                                <i class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% elif message.tags == 'success' %}check-circle{% else %}info-circle{% endif %}"></i> {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                    
                    <div class="input-group">
                        <label class="input-label">Usuário</label>
                        <input name="name" type="text" placeholder="Nome de Usuário" class="input" required 
                               maxlength="150" autocomplete="username" 
                               pattern="[a-zA-Z0-9_@.+-]+" 
                               title="Apenas letras, números e caracteres especiais (@, _, ., +, -) são permitidos" />
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Senha</label>
                        <div class="password-input-wrapper">
                            <input type="password" name="password" id="passwordInput" placeholder="Senha" class="input" required 
                                   maxlength="128" autocomplete="current-password" />
                            <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar/Ocultar senha">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="options">
                        <label class="remember-me">
                            <input type="checkbox" />
                            Lembrar senha
                        </label>
                        <a href="{% url 'solicitar_recuperacao_senha' %}" class="forgot-password">Esqueceu sua senha?</a>
                    </div>
                    
                    <button type="submit" class="button">
                        <i class="fas fa-sign-in-alt"></i>
                        Entrar
                    </button>
                    
                </form>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    // ⚠️ CRÍTICO: Carregar imagem IMEDIATAMENTE para garantir que sempre apareça algo
    (function() {
        // Carregar primeira imagem de fallback imediatamente (antes do DOMContentLoaded)
        const immediateImage = "{% static 'img/back04.png' %}";
        document.body.style.backgroundImage = `url('${immediateImage}')`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundRepeat = 'no-repeat';
        document.body.style.backgroundColor = '#1a1a1a'; // Fallback enquanto carrega
        console.log('🚀 Background inicial carregado imediatamente');
    })();
    
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🎬 Inicializando background de login...');
        
        // 1. Lista de vídeos e imagens com caminhos gerados pelo Django
        const videoAssets = [
            "{% static 'img/back17.mp4' %}",
            "{% static 'img/back18.mp4' %}",
            "{% static 'img/back20.mp4' %}"
        ];
        
        // Imagens de fallback (priorizadas para VPS)
        const imageAssets = [
            "{% static 'img/back04.png' %}",
            "{% static 'img/back05.png' %}",
            "{% static 'img/back06.png' %}",
            "{% static 'img/back07.png' %}",
            "{% static 'img/back08.png' %}",
            "{% static 'img/back09.png' %}",
            "{% static 'img/back10.png' %}",
            "{% static 'img/back11.png' %}",
            "{% static 'img/back12.png' %}",
            "{% static 'img/back13.png' %}"
        ];

        // Detectar se está em ambiente lento (VPS) - usar conexão lenta como indicador
        const isSlowConnection = navigator.connection && (
            navigator.connection.effectiveType === 'slow-2g' || 
            navigator.connection.effectiveType === '2g' ||
            navigator.connection.saveData === true
        );
        
        // Priorizar imagens em conexões lentas ou VPS
        const preferImages = isSlowConnection || localStorage.getItem('preferImages') === 'true';
        
        console.log('📦 Assets disponíveis:', {
            videos: videoAssets.length,
            images: imageAssets.length,
            preferImages: preferImages,
            connectionType: navigator.connection ? navigator.connection.effectiveType : 'unknown'
        });

        // 2. Escolher asset (priorizar imagens se preferImages)
        var lastIndex = parseInt(localStorage.getItem('loginBgIndex'), 10);
        if (isNaN(lastIndex) || lastIndex < 0) {
            lastIndex = -1;
        }
        
        var chosenAsset;
        var chosenIndex;
        
        if (preferImages) {
            // Priorizar imagens
            chosenIndex = imageAssets.length > 1 ? ((lastIndex + 1) % imageAssets.length) : 0;
            chosenAsset = imageAssets[chosenIndex];
            console.log('🖼️ Priorizando imagem (VPS/conexão lenta):', chosenAsset);
        } else {
            // Tentar vídeo primeiro
            const allAssets = [...videoAssets, ...imageAssets];
            chosenIndex = allAssets.length > 1 ? ((lastIndex + 1) % allAssets.length) : 0;
            chosenAsset = allAssets[chosenIndex];
            console.log('✅ Asset escolhido:', chosenAsset);
        }

        // 3. Aplicar o vídeo ou imagem de fundo
        var videoEl = document.getElementById('bgVideo');
        var isVideo = /\.(mp4|webm|ogg)$/i.test(chosenAsset);
        var videoLoaded = false;
        var currentImageSrc = null;

        // Função para carregar imagem (rápida e confiável)
        function loadImage(imageSrc) {
            // Evitar recarregar a mesma imagem
            if (currentImageSrc === imageSrc) return;
            currentImageSrc = imageSrc;
            
            var img = new Image();
            img.onload = function() {
                document.body.style.backgroundImage = `url('${imageSrc}')`;
                document.body.style.backgroundSize = 'cover';
                document.body.style.backgroundPosition = 'center';
                document.body.style.backgroundRepeat = 'no-repeat';
                document.body.style.backgroundColor = ''; // Limpar cor de fallback
                console.log('✅ Imagem de fundo carregada:', imageSrc);
            };
            img.onerror = function() {
                console.error('❌ Erro ao carregar imagem:', imageSrc);
                // Tentar próxima imagem
                var nextImageIndex = (imageAssets.indexOf(imageSrc) + 1) % imageAssets.length;
                var nextImage = imageAssets[nextImageIndex];
                if (nextImage !== imageSrc) {
                    loadImage(nextImage);
                } else {
                    document.body.style.backgroundColor = '#1a1a1a';
                }
            };
            img.src = imageSrc;
        }
        
        // Função para carregar vídeo (opcional, substitui imagem se carregar rápido)
        function loadVideo(videoSrc) {
            if (!videoEl || videoLoaded) return;
            
            console.log('🎥 Tentando carregar vídeo:', videoSrc);
            
            // Timeout reduzido para 1.5 segundos (mais rápido)
            var videoTimeout = setTimeout(function() {
                if (!videoLoaded) {
                    console.warn('⏱️ Timeout ao carregar vídeo (1.5s), mantendo imagem');
                    if (videoEl) videoEl.style.display = 'none';
                }
            }, 1500);
            
            videoEl.src = videoSrc;
            videoEl.style.display = 'block';
            videoEl.load();
            
            videoEl.addEventListener('loadeddata', function() {
                clearTimeout(videoTimeout);
                videoLoaded = true;
                console.log('✅ Vídeo carregado com sucesso');
                // Ocultar background de imagem quando vídeo estiver pronto
                document.body.style.backgroundImage = 'none';
                videoEl.classList.add('playing'); // Adicionar classe para fade in
                videoEl.play().catch(function(error) {
                    console.warn("⚠️ Erro ao reproduzir vídeo:", error);
                    // Se não conseguir reproduzir, manter imagem
                    if (videoEl) {
                        videoEl.style.display = 'none';
                        videoEl.classList.remove('playing');
                    }
                    document.body.style.backgroundImage = `url('${imageAssets[0]}')`;
                });
            });
            
            videoEl.addEventListener('error', function(e) {
                clearTimeout(videoTimeout);
                console.error('❌ Erro no elemento de vídeo:', e);
                if (videoEl) videoEl.style.display = 'none';
                // Manter imagem de fundo
            });
        }

        if (isVideo && videoEl && !preferImages) {
            // Carregar imagem primeiro como fallback visual imediato
            var fallbackImage = imageAssets[0];
            loadImage(fallbackImage);
            
            // Tentar carregar vídeo em paralelo (sem bloquear)
            loadVideo(chosenAsset);
        } else {
            // Carregar imagem diretamente
            console.log('🖼️ Carregando imagem de fundo:', chosenAsset);
            if (videoEl) videoEl.style.display = 'none';
            loadImage(chosenAsset);
        }

        // 4. Salvar o índice para a próxima visita
        try {
            localStorage.setItem('loginBgIndex', String(chosenIndex));
            // Se preferimos imagens, salvar essa preferência
            if (preferImages) {
                localStorage.setItem('preferImages', 'true');
            }
        } catch (e) {
            console.error("⚠️ Não foi possível salvar no localStorage:", e);
        }
        
        // 5. Configurar botão de mostrar/ocultar senha
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (togglePasswordBtn && passwordInput && eyeIcon) {
            togglePasswordBtn.addEventListener('click', function() {
                const isPassword = passwordInput.type === 'password';
                
                if (isPassword) {
                    // Mostrar senha
                    passwordInput.type = 'text';
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                    togglePasswordBtn.setAttribute('aria-label', 'Ocultar senha');
                } else {
                    // Ocultar senha
                    passwordInput.type = 'password';
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                    togglePasswordBtn.setAttribute('aria-label', 'Mostrar senha');
                }
            });
        }
        
        // 6. Validação de segurança adicional no frontend
        const loginForm = document.querySelector('.form');
        const usernameInput = document.querySelector('input[name="name"]');
        const passwordInputField = document.getElementById('passwordInput');
        
        if (loginForm && usernameInput && passwordInputField) {
            loginForm.addEventListener('submit', function(e) {
                // Validar tamanho dos campos antes de enviar
                const username = usernameInput.value.trim();
                const password = passwordInputField.value;
                
                // Limitar tamanho (mesmo que maxlength esteja definido, validar aqui também)
                if (username.length > 150) {
                    e.preventDefault();
                    alert('O nome de usuário não pode ter mais de 150 caracteres.');
                    usernameInput.focus();
                    return false;
                }
                
                if (password.length > 128) {
                    e.preventDefault();
                    alert('A senha não pode ter mais de 128 caracteres.');
                    passwordInputField.focus();
                    return false;
                }
                
                // Validar que não está vazio após trim
                if (!username || username.length === 0) {
                    e.preventDefault();
                    alert('Por favor, preencha o nome de usuário.');
                    usernameInput.focus();
                    return false;
                }
                
                if (!password || password.length === 0) {
                    e.preventDefault();
                    alert('Por favor, preencha a senha.');
                    passwordInputField.focus();
                    return false;
                }
                
                // Sanitizar username (remover espaços extras e caracteres perigosos)
                const sanitizedUsername = username.replace(/\s+/g, ' ').trim();
                if (sanitizedUsername !== username) {
                    usernameInput.value = sanitizedUsername;
                }
            });
            
            // Prevenir colar texto muito longo
            usernameInput.addEventListener('paste', function(e) {
                setTimeout(function() {
                    if (usernameInput.value.length > 150) {
                        usernameInput.value = usernameInput.value.substring(0, 150);
                    }
                }, 0);
            });
            
            passwordInputField.addEventListener('paste', function(e) {
                setTimeout(function() {
                    if (passwordInputField.value.length > 128) {
                        passwordInputField.value = passwordInputField.value.substring(0, 128);
                    }
                }, 0);
            });
            
            // Limitar digitação em tempo real
            usernameInput.addEventListener('input', function(e) {
                if (this.value.length > 150) {
                    this.value = this.value.substring(0, 150);
                }
            });
            
            passwordInputField.addEventListener('input', function(e) {
                if (this.value.length > 128) {
                    this.value = this.value.substring(0, 128);
                }
            });
        }
    });
</script>
