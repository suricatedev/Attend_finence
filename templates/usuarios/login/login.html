{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend Finance - Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>


<!--   #################################### FORM 01 ##################################### FORM 01 ##################################################### -->



<body>
    <!-- O 'src' será definido dinamicamente pelo JavaScript abaixo -->
    <video id="bgVideo" class="bg-video" muted loop playsinline autoplay style="display: block;"></video>
    
    <div class="main-container">
        <div class="login-container">
            <div class="login-box">
                <form class="form" method="POST" action="{% url 'login'%}">
                    {% csrf_token %}
                    <div class="logo">
                        <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo-img">                    </div>
                    <h1 class="header">Bem-vindo de volta</h1>
                    <p class="subtitle">Por favor, insira seus dados.</p>
                    
                    <div class="input-group">
                        <label class="input-label">Usuário</label>
                        <input name="name" type="name" placeholder="Nome de Usuário" class="input" required />
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Senha</label>
                        <input type="password" name="password" placeholder="Senha" class="input" required />
                    </div>
                    
                    <div class="options">
                        <label class="remember-me">
                            <input type="checkbox" />
                            Lembrar senha
                        </label>
                        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                    </div>
                    
                    <button type="submit" class="button">
                        <i class="fas fa-sign-in-alt"></i>
                        Entrar
                    </button>
                    
                </form>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Lista de vídeos e imagens com caminhos gerados pelo Django
        const videoAssets = [
            "{% static 'img/back17.mp4' %}",
            "{% static 'img/back18.mp4' %}",
            "{% static 'img/back20.mp4' %}"
        ];
        
        // Se você também tiver imagens, pode adicioná-las aqui
        const imageAssets = [
            // "{% static 'img/background-login.jpg' %}"
        ];

        const allAssets = [...videoAssets, ...imageAssets];

        // 2. Lógica para escolher um asset diferente a cada visita
        var lastIndex = parseInt(localStorage.getItem('loginBgIndex'), 10);
        if (isNaN(lastIndex) || lastIndex < 0 || lastIndex >= allAssets.length) {
            lastIndex = -1; // Força a escolha de um novo na primeira vez
        }
        
        var nextIndex = allAssets.length > 1 ? (lastIndex + 1) % allAssets.length : 0;
        var chosenAsset = allAssets[nextIndex];

        // 3. Aplicar o vídeo ou imagem de fundo
        var videoEl = document.getElementById('bgVideo');
        var isVideo = /\.(mp4|webm|ogg)$/i.test(chosenAsset);

        if (isVideo && videoEl) {
            videoEl.src = chosenAsset;
            videoEl.style.display = 'block';
            videoEl.play().catch(function(error) {
                console.warn("A reprodução automática do vídeo foi bloqueada pelo navegador.", error);
            });
        } else {
            if (videoEl) videoEl.style.display = 'none';
            document.body.style.backgroundImage = `url('${chosenAsset}')`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            document.body.style.backgroundRepeat = 'no-repeat';
        }

        // 4. Salvar o índice para a próxima visita
        try {
            localStorage.setItem('loginBgIndex', String(nextIndex));
        } catch (e) {
            console.error("Não foi possível salvar o índice do background no localStorage.", e);
        }
    });
</script>
