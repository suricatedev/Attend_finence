{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attend Finance - Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>


<!--   #################################### FORM 01 ##################################### FORM 01 ##################################################### -->



<body>
    <video id="bgVideo" class="bg-video" muted loop playsinline></video>
    <div class="main-container">
        <div class="login-container">
            <div class="login-box">
                <form class="form" method="POST" action="{% url 'login'%}">
                    {% csrf_token %}
                    <div class="logo">
                        <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo-img">
                    </div>
                    <h1 class="header">Bem-vindo de volta</h1>
                    <p class="subtitle">Por favor, insira seus dados.</p>
                    
                    <div class="input-group">
                        <label class="input-label">Usuário</label>
                        <input name="name" type="name" placeholder="Nome de Usuário" class="input" required />
                    </div>
                    
                    <div class="input-group">
                        <label class="input-label">Senha</label>
                        <input type="password" name="password" placeholder="Senha" class="input" required />
                    </div>
                    
                    <div class="options">
                        <label class="remember-me">
                            <input type="checkbox" />
                            Lembrar senha
                        </label>
                        <a href="#" class="forgot-password">Esqueceu sua senha?</a>
                    </div>
                    
                    <button type="submit" class="button">
                        <i class="fas fa-sign-in-alt"></i>
                        Entrar
                    </button>
                    
                </form>
            </div>
        </div>
    </div>
</body>
</html>
<script>
    (function() {
        var assets = ['back10.png','back17.mp4','back18.mp4','back09.png','back20.mp4','back08.png','back05.png',];
        var lastIndex = parseInt(localStorage.getItem('loginBgIndex'), 10);
        if (isNaN(lastIndex) || lastIndex < 0 || lastIndex >= assets.length) {
            lastIndex = Math.floor(Math.random() * assets.length);
        }
        var nextIndex = assets.length > 1 ? (lastIndex + 1) % assets.length : 0;
        var chosen = assets[nextIndex];
        document.addEventListener('DOMContentLoaded', function() {
            var isVideo = /\.(mp4|webm|ogg)$/i.test(chosen);
            var videoEl = document.getElementById('bgVideo');
            if (isVideo) {
                if (videoEl) {
                    videoEl.src = '/static/img/' + chosen;
                    videoEl.style.display = 'block';
                    videoEl.autoplay = true;
                    try { videoEl.play().catch(function(){}); } catch(e) {}
                }
            } else {
                if (videoEl) {
                    videoEl.pause();
                    videoEl.removeAttribute('src');
                    videoEl.load();
                    videoEl.style.display = 'none';
                }
                document.body.style.background = "url('/static/img/" + chosen + "') center/cover no-repeat !important";
            }
        });
        try { localStorage.setItem('loginBgIndex', String(nextIndex)); } catch (e) {}
    })();
</script>
