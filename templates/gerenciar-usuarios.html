<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Sistema Financeiro</title>
    <link rel="stylesheet" href="static/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 50%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255, 203, 87, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 203, 87, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            z-index: -1;
        }
        
        .test-container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            overflow: hidden;
            animation: slideUp 0.6s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .test-header {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            color: #FFCB57;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .test-header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .test-header p {
            margin: 0.3rem 0 0 0;
            opacity: 0.8;
            font-size: 0.8rem;
        }
        
        .test-icon {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 2rem;
            opacity: 0.3;
        }
        
        .modal {
            position: relative;
            display: block;
            background: transparent;
            z-index: 1;
        }
        
        .modal-content {
            background: rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0;
            box-shadow: none;
            margin: 0;
            max-width: none;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-header {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            color: #FFCB57;
            padding: 1rem;
            border-radius: 0;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFCB57;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .close-btn:hover {
            background: rgba(255, 203, 87, 0.2);
            transform: scale(1.1);
            border-color: #FFCB57;
        }
        
        .user-form {
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .form-group {
            margin-bottom: 1rem;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            box-sizing: border-box;
            box-shadow: 
                0 4px 6px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .form-group input::placeholder,
        .form-group select::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .form-group select option {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0.5rem;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #FFCB57;
            background: rgba(40, 40, 40, 0.9);
            box-shadow: 
                0 0 0 3px rgba(255, 203, 87, 0.3),
                0 6px 12px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .form-group input:hover,
        .form-group select:hover {
            border-color: rgba(255, 203, 87, 0.4);
            background: rgba(35, 35, 35, 0.9);
            box-shadow: 
                0 6px 12px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .form-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        
        .btn-register {
            background: linear-gradient(135deg, #FFCB57, #e0bc18);
            color: #1C1C1C;
            border: 1px solid rgba(255, 203, 87, 0.3);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            min-width: 120px;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 203, 87, 0.3);
        }
        
        .btn-cancel {
            background: rgba(108, 117, 125, 0.3);
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            min-width: 120px;
            justify-content: center;
            backdrop-filter: blur(10px);
        }
        
        .btn-cancel:hover {
            background: rgba(90, 98, 104, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            
            .test-container {
                margin: 5px;
                border-radius: 10px;
            }
            
            .user-form {
                padding: 1rem;
            }
            
            .form-actions {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .btn-register,
            .btn-cancel {
                width: 100%;
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="test-header">
            <h1><i class="fas fa-user-plus"></i> Sistema de Cadastro</h1>
            <p>Formulário de registro de usuários</p>
            <i class="fas fa-users test-icon"></i>
        </div>
    <!-- Modal para gerenciar membros -->
    <div class="modal show" id="manageMembersModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus"></i> Cadastro de Usuário</h2>
                <button class="close-btn" id="closeMembersModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="userRegistrationForm" class="user-form">
                    <div class="form-group">
                        <label for="username">Nome de usuário:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="first_name">Primeiro nome:</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="last_name">Último nome:</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="role">Função:</label>
                        <select id="role" name="role" required>
                            <option value="">Selecione uma função</option>
                            <option value="financeiro">Financeiro</option>
                            <option value="solicitante">Solicitante</option>
                        </select>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-register">
                            <i class="fas fa-user-plus"></i>
                            Cadastrar
                        </button>
                        <button type="button" class="btn-cancel" id="cancelUserRegistration">
                            <i class="fas fa-times"></i>
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="static/js/script-light.js"></script>
    <script>
        // Funcionalidades específicas para a página de teste
        document.addEventListener('DOMContentLoaded', function() {
            // Adicionar animação aos campos
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach((input, index) => {
                input.style.animationDelay = `${index * 0.1}s`;
                input.style.animation = 'fadeInUp 0.6s ease forwards';
            });
            
            // Validação em tempo real
            const form = document.getElementById('userRegistrationForm');
            const inputs2 = form.querySelectorAll('input, select');
            
            inputs2.forEach(input => {
                input.addEventListener('blur', function() {
                    validateField(this);
                });
                
                input.addEventListener('input', function() {
                    if (this.classList.contains('error')) {
                        validateField(this);
                    }
                });
            });
            
            // Validação do formulário
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                let isValid = true;
                inputs2.forEach(input => {
                    if (!validateField(input)) {
                        isValid = false;
                    }
                });
                
                if (isValid) {
                    showSuccessMessage();
                }
            });
        });
        
        function validateField(field) {
            const value = field.value.trim();
            const fieldName = field.name;
            let isValid = true;
            let errorMessage = '';
            
            // Remover classes de erro anteriores
            field.classList.remove('error', 'success');
            
            if (!value) {
                errorMessage = 'Este campo é obrigatório';
                isValid = false;
            } else {
                switch(fieldName) {
                    case 'email':
                        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                        if (!emailRegex.test(value)) {
                            errorMessage = 'E-mail inválido';
                            isValid = false;
                        }
                        break;
                    case 'password':
                        if (value.length < 6) {
                            errorMessage = 'Senha deve ter pelo menos 6 caracteres';
                            isValid = false;
                        }
                        break;
                    case 'username':
                        if (value.length < 3) {
                            errorMessage = 'Nome de usuário deve ter pelo menos 3 caracteres';
                            isValid = false;
                        }
                        break;
                }
            }
            
            if (!isValid) {
                field.classList.add('error');
                showFieldError(field, errorMessage);
            } else {
                field.classList.add('success');
                hideFieldError(field);
            }
            
            return isValid;
        }
        
        function showFieldError(field, message) {
            hideFieldError(field);
            
            const errorDiv = document.createElement('div');
            errorDiv.className = 'field-error';
            errorDiv.textContent = message;
            errorDiv.style.cssText = `
                color: #ff4757;
                font-size: 0.85rem;
                margin-top: 0.5rem;
                animation: slideDown 0.3s ease;
                font-weight: 500;
                background: rgba(255, 71, 87, 0.1);
                padding: 0.5rem 0.75rem;
                border-radius: 6px;
                border-left: 3px solid #ff4757;
                backdrop-filter: blur(10px);
                box-shadow: 0 2px 4px rgba(255, 71, 87, 0.1);
            `;
            
            field.parentNode.appendChild(errorDiv);
        }
        
        function hideFieldError(field) {
            const existingError = field.parentNode.querySelector('.field-error');
            if (existingError) {
                existingError.remove();
            }
        }
        
        function showSuccessMessage() {
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.innerHTML = `
                <div style="
                    background: rgba(76, 175, 80, 0.2);
                    backdrop-filter: blur(10px);
                    border: 1px solid rgba(76, 175, 80, 0.3);
                    color: #4CAF50;
                    padding: 1rem 2rem;
                    border-radius: 12px;
                    text-align: center;
                    margin: 1rem 0;
                    animation: slideUp 0.6s ease;
                    box-shadow: 0 10px 25px rgba(76, 175, 80, 0.2);
                ">
                    <i class="fas fa-check-circle" style="font-size: 1.5rem; margin-bottom: 0.5rem; display: block; color: #4CAF50;"></i>
                    <h3 style="margin: 0 0 0.5rem 0; color: #4CAF50;">Usuário Cadastrado com Sucesso!</h3>
                    <p style="margin: 0; opacity: 0.9; color: rgba(255, 255, 255, 0.8);">Todos os dados foram validados e estão prontos para envio.</p>
                </div>
            `;
            
            const form = document.getElementById('userRegistrationForm');
            form.parentNode.insertBefore(successDiv, form);
            
            // Scroll para a mensagem
            successDiv.scrollIntoView({ behavior: 'smooth' });
            
            // Limpar formulário após 3 segundos
            setTimeout(() => {
                form.reset();
                successDiv.remove();
                // Remover classes de validação
                const inputs = form.querySelectorAll('input, select');
                inputs.forEach(input => {
                    input.classList.remove('error', 'success');
                });
            }, 3000);
        }
        
        // Adicionar estilos CSS para animações
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            .form-group input.error,
            .form-group select.error {
                border-color: #ff4757;
                background: rgba(255, 71, 87, 0.1);
                box-shadow: 
                    0 0 0 3px rgba(255, 71, 87, 0.3),
                    0 6px 12px rgba(255, 71, 87, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
                animation: shake 0.5s ease;
            }
            
            .form-group input.success,
            .form-group select.success {
                border-color: #2ed573;
                background: rgba(46, 213, 115, 0.1);
                box-shadow: 
                    0 0 0 3px rgba(46, 213, 115, 0.3),
                    0 6px 12px rgba(46, 213, 115, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
            
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
